<!DOCTYPE html>
<html>
<head>
    <title>Pi IoT Controller</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 15px; margin: 10px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Room Navigation</h2>
        <button onclick="sendRoom('room1')">Go to Room 1</button>
        <button onclick="sendRoom('room2')">Go to Room 2</button>
        <p id="status">Connecting...</p>
    </div>

    <script>
        // Browser connects to the Pi Broker via WebSockets
        const client = mqtt.connect('ws://192.168.1.50:9001');

        client.on('connect', () => {
            document.getElementById('status').innerText = "Connected to Pi Broker";
        });

        function sendRoom(room) {
            if (client.connected) {
                // This sends the message to your ESP32
                client.publish('esp32', room);
                console.log("Published: " + room);
            }
        }
    </script>
</body>
</html>
