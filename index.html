<!DOCTYPE html>
<html>
<head>
    <title>Pi IoT Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: green; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; margin: 10px; width: 80px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Pi Math Controller</h2>
        <input type="number" id="num1" placeholder="Num 1">
        <input type="number" id="num2" placeholder="Num 2">
        <br>
        <button onclick="calc('+')">Add</button>
        <button onclick="calc('-')">Sub</button>
        <button onclick="calc('*')">Mul</button>
        <button onclick="calc('/')">Div</button>
        <h1 id="result">Result: 0</h1>
    </div>

    <script>
        function calc(op) {
            const n1 = parseFloat(document.getElementById('num1').value) || 0;
            const n2 = parseFloat(document.getElementById('num2').value) || 0;
            let res = 0;
            if (op === '+') res = n1 + n2;
            if (op === '-') res = n1 - n2;
            if (op === '*') res = n1 * n2;
            if (op === '/') res = n2 !== 0 ? n1 / n2 : 'Error';
            document.getElementById('result').innerText = "Result: " + res;
        }
    </script>
</body>
</html>
